services:
  prefetcharr:
    image: ghcr.io/panda260/prefetcharr:latest
    container_name: prefetcharr
    environment:
      - |
        PREFETCHARR_CONFIG=
        # Start of the configuration in TOML format.

        interval = 300           # Polling interval in seconds
        log_dir = "/log"         # Logging directory
        log_level = "Info"       # `Trace`, `Debug`, `Info`, `Warn` or `Error`
        prefetch_num = 3         # Number of episodes to make available in advance
        request_seasons = true   # Always request full seasons to prefer season packs
        append_to_queue = false  # Experimental: Append upcoming episodes to the player's active queue.
        controlled_season_monitoring = "off"  # "off" (default), "on_demand", or "all"
                                              # "off"       – original behaviour, Sonarr monitorNewItems unchanged
                                              # "on_demand" – limit to one season ahead while a user is actively watching
                                              # "all"       – same as on_demand + reset ALL series to monitorNewItems=none on startup
        connection_retries = 6   # Number of retries for the initial connection probing

        [media_server]
        type = "Jellyfin"
        url = "http://[IP_ADDRESS]:[PORT]"
        api_key = ""

        # Sonarr Instance 1 (1080p)
        [[sonarr]]
        url = "http://[IP_ADDRESS]:[PORT]"
        api_key = ""
        path = "/path/to/series/"

        # Sonarr Instance 2 (4K)
        [[sonarr]]
        url = "http://[IP_ADDRESS]:[PORT]"
        api_key = ""
        path = "/path/to/series-4k/"

    volumes:
      - ./log:/log
