name: Docker Build and Push

on:
  push:
    branches:
      - '**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract branch name and format tag
        id: format_tag
        run: |
          # Extrahiere den Branch-Namen aus GITHUB_REF (z.B. refs/heads/feature/test -> feature/test)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          # Ersetze alle Slashes (/) durch Bindestriche (-)
          FORMATTED_TAG=${BRANCH_NAME//\//-}
          
          echo "tag=$FORMATTED_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.format_tag.outputs.tag }}
